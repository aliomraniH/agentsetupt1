name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - master

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --maxfail=5
        continue-on-error: false

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: |
          ruff check src/ --ignore E501,F401 || true

      - name: Check formatting
        run: |
          black --check src/ || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start server
        run: |
          python -m uvicorn src.core.server:app --host 0.0.0.0 --port 8080 &
          sleep 5

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Test agents endpoint
        run: |
          curl -f http://localhost:8080/api/v1/agents || exit 1

      - name: Test health monitor agent
        run: |
          curl -f -X POST http://localhost:8080/api/v1/agents/health-monitor/run || exit 1

      - name: Test stock monitor agent
        run: |
          curl -f http://localhost:8080/api/v1/agents/stock-monitor/quick || exit 1

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [test, lint, integration]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "✅ All checks passed!"
          echo ""
          echo "PR is ready to merge to main"
