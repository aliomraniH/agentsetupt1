name: News Search Agent

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Stock symbols (comma-separated, e.g., AAPL,GOOGL,TSLA)'
        required: false
        type: string
      company_names:
        description: 'Company names (comma-separated, e.g., Apple,Google)'
        required: false
        type: string

  # Scheduled runs (weekdays after market close)
  schedule:
    # Run at 5 PM ET (22:00 UTC) weekdays
    - cron: '0 22 * * 1-5'

  # Trigger on agent code changes
  push:
    branches:
      - 'agents/news-search/**'
    paths:
      - 'src/agents/news_search.py'

env:
  PYTHON_VERSION: '3.11'

jobs:
  search-news:
    name: Search Stock News
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Search News
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          echo "📰 Running News Search Agent"
          echo "============================"
          echo ""

          URL="${BACKEND_URL:-http://localhost:8080}"
          SYMBOLS="${{ github.event.inputs.symbols || 'AAPL,GOOGL,MSFT' }}"
          COMPANIES="${{ github.event.inputs.company_names }}"

          echo "Backend URL: $URL"
          echo "Searching for: $SYMBOLS"

          # Build JSON payload
          if [ -n "$COMPANIES" ]; then
            # Convert comma-separated strings to JSON arrays
            SYMBOLS_JSON=$(echo "$SYMBOLS" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | tr '\n' ',' | sed 's/,$//' | sed 's/^/[/;s/$/]/')
            COMPANIES_JSON=$(echo "$COMPANIES" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | tr '\n' ',' | sed 's/,$//' | sed 's/^/[/;s/$/]/')

            PAYLOAD="{\"symbols\": $SYMBOLS_JSON, \"company_names\": $COMPANIES_JSON}"
          else
            SYMBOLS_JSON=$(echo "$SYMBOLS" | tr ',' '\n' | sed 's/^/"/;s/$/"/' | tr '\n' ',' | sed 's/,$//' | sed 's/^/[/;s/$/]/')
            PAYLOAD="{\"symbols\": $SYMBOLS_JSON}"
          fi

          response=$(curl -s -X POST "$URL/api/v1/agents/news-search/run" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>/dev/null || echo '{"error": "Request failed"}')

          echo ""
          echo "📊 News Search Results"
          echo "====================="
          echo ""

          # Check if response is valid JSON
          if echo "$response" | python -m json.tool > /dev/null 2>&1; then
            # Pretty print the response
            echo "$response" | python -m json.tool

            # Extract summary if available
            echo ""
            echo "📋 Quick Summary"
            echo "==============="
            echo "$response" | python -c "
import sys, json
data = json.load(sys.stdin)
if 'result' in data and 'claude_summary' in data['result']:
    print(data['result']['claude_summary'])
elif 'claude_summary' in data:
    print(data['claude_summary'])
else:
    print('No summary available')
"
          else
            echo "Error: Invalid response from server"
            echo "$response"
            exit 1
          fi

  notify-summary:
    name: Post Summary
    runs-on: ubuntu-latest
    needs: search-news
    if: always()

    steps:
      - name: Summary
        run: |
          echo "📰 News Search Agent completed"
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"

          # Add notification integrations here:
          # - Slack webhook
          # - Discord webhook
          # - Email notification
