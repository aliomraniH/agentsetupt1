name: Health Monitor Agent

on:
  # Scheduled health checks
  schedule:
    # Run every hour
    - cron: '0 * * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of health check'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend-only
          - quick

  # Trigger on specific branch pushes
  push:
    branches:
      - 'agents/health-monitor/**'
    paths:
      - 'src/agents/health_monitor.py'
      - 'src/agents/base.py'

env:
  PYTHON_VERSION: '3.11'

jobs:
  health-check:
    name: Run Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Health Check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          echo "🏥 Running Health Monitor Agent"
          echo "================================"
          echo ""

          # Default to localhost if no URL configured
          URL="${BACKEND_URL:-http://localhost:8080}"

          echo "Checking: $URL/health"
          echo ""

          # Make health check request
          response=$(curl -s -w "\n%{http_code}" "$URL/health" 2>/dev/null || echo -e "\n000")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          if [ "$status" = "200" ]; then
            echo "✅ Backend is HEALTHY"
            echo ""
            echo "Response:"
            echo "$body" | python -m json.tool 2>/dev/null || echo "$body"
          elif [ "$status" = "000" ]; then
            echo "⚠️ Backend is UNREACHABLE"
            echo ""
            echo "The backend service could not be reached."
            echo "This might be expected if the service is not deployed yet."
          else
            echo "❌ Backend is UNHEALTHY"
            echo ""
            echo "Status Code: $status"
            echo "Response: $body"
            exit 1
          fi

      - name: Detailed Health Check
        if: github.event.inputs.check_type == 'all' || github.event_name == 'schedule'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          URL="${BACKEND_URL:-http://localhost:8080}"

          echo ""
          echo "📊 Detailed Health Information"
          echo "=============================="
          echo ""

          curl -s "$URL/health/detailed" | python -m json.tool 2>/dev/null || echo "Detailed check unavailable"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()

    steps:
      - name: Notification
        run: |
          echo "🚨 Health Check Failed!"
          echo ""
          echo "The health check workflow has detected issues."
          echo "Please investigate the deployment."
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"

          # Add your notification integration here
          # Examples:
          # - Slack webhook
          # - Discord webhook
          # - Email via SendGrid
          # - PagerDuty
